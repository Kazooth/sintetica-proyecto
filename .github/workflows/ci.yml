name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          # Crear rol y base de datos requeridos por la app
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c 'DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = ''user'') THEN CREATE ROLE "user" WITH LOGIN PASSWORD ''sintetica''; END IF; END $$;'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c 'ALTER ROLE "user" WITH LOGIN PASSWORD ''sintetica'';'
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE girardot OWNER "user";' || true
          # Extensión necesaria por migrations/tests
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d girardot -c 'CREATE EXTENSION IF NOT EXISTS btree_gist;'
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check . --output-format=github
          ruff format --check .
      - name: Type check (mypy)
        run: |
          # Type-check only application code; tests are executed but not type-checked in CI
          mypy --config-file mypy.ini app
      - name: Wait for Postgres
        env:
          PGPASSWORD: sintetica
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U user; do sleep 1; done
      - name: Export DATABASE_URL
        run: |
          echo "DATABASE_URL=postgresql+psycopg://user:sintetica@localhost:5432/girardot" >> $GITHUB_ENV
      - name: Run migrations
        run: |
          python -m alembic upgrade head
      - name: Run tests
        run: |
          pytest -q
