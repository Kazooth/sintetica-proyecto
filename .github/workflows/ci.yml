name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Use AWS ECR Public mirror to avoid transient Docker Hub 503 errors
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: sintetica
          POSTGRES_DB: girardot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d girardot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # Fallback: proactively pull mirror image with simple retry (non-blocking if service already started)
      - name: Pre-pull Postgres image (retry)
        run: |
          for i in 1 2 3; do docker pull public.ecr.aws/docker/library/postgres:15 && break || sleep $((2*i)); done
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check . --output-format=github
          ruff format --check .
      - name: Type check (mypy)
        run: |
          # Type-check only application code; tests are executed but not type-checked in CI
          mypy --config-file mypy.ini app
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U user; do sleep 1; done
      - name: Export DATABASE_URL
        run: |
          echo "DATABASE_URL=postgresql+psycopg://user:sintetica@localhost:5432/girardot" >> $GITHUB_ENV
      - name: Run migrations
        run: |
          python -m alembic upgrade head
      - name: Run tests
        run: |
          pytest -q
