name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (robust pull + run)
        run: |
          set -e
          IMG=""
          for REG in public.ecr.aws/docker/library/postgres docker.io/library/postgres; do
            for i in 1 2 3 4 5; do
              if docker pull "${REG}:15"; then IMG="${REG}:15"; break; else sleep $((2*i)); fi
            done
            [ -n "$IMG" ] && break
          done
          if [ -z "$IMG" ]; then echo "Failed to pull Postgres image from all registries"; exit 1; fi
          echo "POSTGRES_IMAGE=$IMG" >> $GITHUB_ENV
          docker run -d --name postgres-ci -p 5432:5432 \
            -e POSTGRES_USER=user -e POSTGRES_PASSWORD=sintetica -e POSTGRES_DB=girardot "$IMG"
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check . --output-format=github
          ruff format --check .
      - name: Type check (mypy)
        run: |
          # Type-check only application code; tests are executed but not type-checked in CI
          mypy --config-file mypy.ini app
      - name: Wait for Postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U user; do sleep 1; done
      - name: Export DATABASE_URL
        run: |
          echo "DATABASE_URL=postgresql+psycopg://user:sintetica@localhost:5432/girardot" >> $GITHUB_ENV
      - name: Run migrations
        run: |
          python -m alembic upgrade head
      - name: Run tests
        run: |
          pytest -q
      - name: Stop Postgres container
        if: always()
        run: |
          docker rm -f postgres-ci || true
