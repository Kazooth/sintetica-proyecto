version: "3.9"
services:
  db:
    image: postgres:15
    container_name: sintetica-db
    restart: always
    environment:
      POSTGRES_DB: girardot
      POSTGRES_USER: user
      POSTGRES_PASSWORD: sintetica
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d girardot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sintetica-api
    environment:
      DATABASE_URL: postgresql+psycopg://user:sintetica@db:5432/girardot
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: please_change_me
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
