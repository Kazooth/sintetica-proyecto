version: "3.9"
services:
  db:
    image: postgres:15
    container_name: sintetica-db
    restart: always
    environment:
      POSTGRES_DB: girardot
      POSTGRES_USER: user
      POSTGRES_PASSWORD: sintetica
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d girardot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
